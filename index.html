<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Music Streamer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #242424;
            color: #fff;
            outline: none;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #1db954;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1ed760; }
        .track-list {
            list-style: none;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .track-item {
            padding: 10px;
            border-bottom: 1px solid #282828;
            cursor: pointer;
        }
        .track-item:hover { background: #282828; border-radius: 4px; }
        .track-item small { color: #b3b3b3; }
        .player-bar { text-align: center; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search song or artist..." onkeypress="if(event.key === 'Enter') searchSongs()">
        <button onclick="searchSongs()">Search</button>
    </div>

    <ul id="trackList" class="track-list">
        <li class="track-item" style="text-align: center; color: #777;">Search for a song above</li>
    </ul>

    <div class="player-bar">
        <p id="nowPlaying">Select a track to play</p>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    // Configured with your live Render backend URL
    const BACKEND_URL = "https://boingamusic-backend-test.onrender.com";

    async function searchSongs() {
        const query = document.getElementById('searchInput').value;
        if (!query) return;

        const trackList = document.getElementById('trackList');
        trackList.innerHTML = '<li class="track-item" style="text-align: center;">Searching...</li>';

        try {
            const response = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
            const tracks = await response.json();

            trackList.innerHTML = '';
            if (tracks.length === 0) {
                trackList.innerHTML = '<li class="track-item" style="text-align: center;">No results found</li>';
                return;
            }

            tracks.forEach(track => {
                const li = document.createElement('li');
                li.className = 'track-item';
                li.innerHTML = `<strong>${track.title}</strong><br><small>${track.artist}</small>`;
                li.onclick = () => playTrack(track);
                trackList.appendChild(li);
            });
        } catch (err) {
            trackList.innerHTML = '<li class="track-item" style="text-align: center; color: #ff5555;">Error connecting to backend</li>';
            console.error(err);
        }
    }

    function playTrack(track) {
        document.getElementById('nowPlaying').textContent = `Now Playing: ${track.title}`;
        const audioPlayer = document.getElementById('audioPlayer');
        
        // Routes audio playback directly through your Render server stream endpoint
        audioPlayer.src = `${BACKEND_URL}/api/stream/${track.videoId}`;
        audioPlayer.play().catch(e => console.log("Playback error:", e));
    }
</script>

</body>
</html>
